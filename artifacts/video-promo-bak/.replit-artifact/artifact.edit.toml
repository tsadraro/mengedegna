kind = "web"
previewPath = "/video-promo"
title = "Mengedegna Video"
version = "1.0.0"
id = "artifacts/video-promo"
router = "path"

[[services]]
name = "web"
paths = [ "/video-promo" ]
localPort = 22324

[services.development]
run = "pnpm --filter @workspace/mengedegna-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mengedegna-video", "run", "build" ]
serve = "static"
publicDir = "artifacts/video-promo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22324"
BASE_PATH = "/video-promo"
